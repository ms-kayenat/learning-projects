// best way : ->

//select parent elm
const btnGroup = document.querySelector('.tabs-rounded')
btnGroup.addEventListener('click',(e)=>{
    // checking  btn class clicked or not
    const clickedBtn = e.target.closest(".btn")
    //if not then return 
    if(!clickedBtn)return;

    // searching already active class and then removing
    const currentActiveBtn = btnGroup.querySelector('.is-active');
    if(currentActiveBtn){
        currentActiveBtn.classList.remove('is-active');

    }
    // next not selected if click then ..
    clickedBtn.classList.add('is-active');
})
</script>
