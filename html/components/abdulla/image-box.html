<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Box</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="coffee-card-box">
    <div class="coffee-card">
      <img class="coffee-card-image" src="/assets/img/spinn-blend.png" alt="Spinn Blend Subscription" />
      <div class="coffee-card-content">
        <h2 class="coffee-card-title">
          Spinn Blend<br />
          Subscription
        </h2>
        <p class="coffee-card-description">
          Enjoy a curated selection of medium and dark roasts every morning
          with our Spinn Blend Subscription
        </p>
      </div>
    </div>
  </div>
  <br /><br />
  <div class="shipping-card">
    <h2 class="shipping-card-title">FREE Shipping</h2>
  </div>
</body>
</html>
