<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Wellness Card</title>
	<!-- Google Fonts: Lato -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
	<!-- Remix Icon CDN -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="../../../assets/css/styles.css">
</head>
<body style="padding: 2rem; background: #f1f4f2; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

	<div class="wellness-card">
		<div class="wellness-card-content">
			<div class="wellness-card-header">
				<p class="wellness-card-eyebrow">#002</p>
				<h3 class="wellness-card-title">Ayurvedic Wellness</h3>
				<p class="wellness-card-subtitle">Energy Drink. Instant Energy. Try Now.</p>
			</div>

			<div class="wellness-card-media">
				<img
					class="wellness-card-image"
					src="../../../assets/img/ayurvedic-wellness-bottle.png"
					alt="Shivpragi Ayurvedic Wellness Capsules"
				>
			</div>

			<div class="wellness-card-actions">
				<button type="button" class="btn btn-primary">
					<span class="btn-text">View Product</span>
					<span class="btn-icon">
						<i class="ri-external-link-line"></i>
					</span>
				</button>
				<button type="button" class="btn btn-secondary">
					<span class="btn-text">Send Request</span>
				</button>
			</div>
		</div>
	</div>

</body>
</html>
